name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chengine
          POSTGRES_PASSWORD: chengine
          POSTGRES_DB: chengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chengine -d chengine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHENGINE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/chengine_test
      CHENGINE_TEST_POSTGRES_USER: chengine
      CHENGINE_TEST_POSTGRES_PASSWORD: chengine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: gradle
      - name: Verify embedded documentation examples
        run: python3 scripts/sync-doc-examples.py --check
      - name: Build and run tests
        run: ./gradlew build --no-daemon
      - name: Publish to an isolated local Maven repository
        run: ./gradlew publishToMavenLocal --no-daemon -Dmaven.repo.local="$RUNNER_TEMP/chengine-maven"
      - name: Verify a separate consumer
        env:
          CHENGINE_LOCAL_MAVEN: ${{ runner.temp }}/chengine-maven
        run: ./gradlew -p verification/consumer run --no-daemon
      - name: Verify Maven POM consumption
        env:
          CHENGINE_LOCAL_MAVEN: ${{ runner.temp }}/chengine-maven
          CHENGINE_POM_ONLY: 'true'
        run: ./gradlew -p verification/consumer clean run --no-daemon --refresh-dependencies
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 7
